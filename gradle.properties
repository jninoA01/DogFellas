# ==========================================
# DOGFELLAS - CONFIGURACION PARA 4 GB RAM
# ==========================================

org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# R8 / recursos
android.nonTransitiveRClass=true

# Gradle
org.gradle.daemon=true
org.gradle.parallel=false

# Red
systemProp.org.gradle.internal.http.connectionTimeout=150000
systemProp.org.gradle.internal.http.socketTimeout=150000